    <rect x="132" y="232" width="56" height="40" rx="8" fill="#3b82f6" />
    <rect x="228" y="232" width="56" height="40" rx="8" fill="#10b981" />
    <rect x="324" y="232" width="56" height="40" rx="8" fill="#f59e0b" />
    
    <rect x="132" y="304" width="56" height="40" rx="8" fill="#e2e8f0" />
    <rect x="228" y="304" width="56" height="40" rx="8" fill="#3b82f6" />
    <rect x="324" y="304" width="56" height="40" rx="8" fill="#8b5cf6" />
    <!-- Clock badge -->
